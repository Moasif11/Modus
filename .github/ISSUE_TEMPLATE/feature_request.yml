name: "✨ Feature Request"
description: Suggest an idea or enhancement for MODUS ERP
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome proposals for new tax regulations, banking integrations, invoicing workflows, and UI improvements!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - "Receivables & Invoicing"
        - "GST & Tax Engine (GSTR-1, GSTR-3B, GSTR-2B)"
        - "Payables & Expenses (OCR, Bills)"
        - "Quotations & Proformas"
        - "Banking & Payments"
        - "White-Label & Branding"
        - "Mobile App (Expo)"
        - "Other"
    validations:
      required: true
