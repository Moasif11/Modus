name: "Bug Report"
description: File a bug report to help us improve MODUS ERP
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please search existing issues before filing a duplicate.
  - type: input
    id: version
    attributes:
      label: MODUS ERP Version / Commit
      description: What version or git commit SHA are you running?
      placeholder: "e.g. main branch, commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - "Local Node.js 20+ / Bun"
        - "Docker Compose"
        - "Neon Serverless PostgreSQL"
        - "Self-hosted PostgreSQL"
        - "Cloudflare / Vercel"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Precise steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Screenshots
      description: Paste any server terminal output, browser console logs, or upload screenshots.
      render: shell
